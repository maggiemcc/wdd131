<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Maggie McCausland">
    <meta name="description" content="WDD131 Week 5 product review form assignment">
    <link href="styles/form.css" rel="stylesheet">
    <script src="scripts/getdates.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <fieldset class="product">
                <label>Product Name
                    <select name="product" id="productName" required>
                        <option value="" selected disabled>Select a Product</option>
                    </select>
                </label>
            </fieldset>

            <fieldset class="rating">
                <legend>Overall Rating</legend>
                <label>☆<input type="radio" name="rating" value="one" id="one-rating" required></label>
                <label>☆☆<input type="radio" name="rating" value="two" id="two-rating" required></label>
                <label>☆☆☆<input type="radio" name="rating" value="three" id="three-rating" required></label>
                <label>☆☆☆☆<input type="radio" name="rating" value="four" id="four-rating" required></label>
                <label>☆☆☆☆☆<input type="radio" name="rating" value="five" id="five-rating" required></label>
            </fieldset>

            <fieldset class="installation">
                <label>Date of Installation
                    <input type="date" name="installationDate" id="installed" required>
                </label>
            </fieldset>

            <fieldset class="features">
                <legend>Which features did you find useful in the product? (Check all that apply)</legend>
                <label><input type="checkbox" name="durabilty" id="durability" value="yes">Durabilty</label>
                <label><input type="checkbox" name="ease" id="ease" value="yes">Ease of Use</label>
                <label><input type="checkbox" name="performance" id="performance" value="yes">Performance</label>
                <label><input type="checkbox" name="design" id="design" value="yes">Design</label>
            </fieldset>

            <fieldset>
                <legend>Written Review <span>(optional)</span></legend>
                <textarea id="review" name="review"></textarea>
            </fieldset>

            <fieldset>
                <legend>Your Name <span>(optional)</span></legend>
                <input type="text" id="usersname" name="usersname">
            </fieldset>

            <input type="submit" value="Post Review">

        </form>
    </main>
    <footer>
        <p>©<span id="currentYear"></span> 🐝 Maggie McCausland 🐝 Utah, USA</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>
